name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: rtilens
          POSTGRES_PASSWORD: rtilens_test
          POSTGRES_DB: rtilens_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        python3 -c "import nltk; nltk.download('stopwords')"

    - name: Load database schema
      env:
        DATABASE_URL: postgresql://rtilens:rtilens_test@localhost:5432/rtilens_test
      run: |
        psql $DATABASE_URL -f schema.sql

    - name: Run ORM integrity tests
      env:
        DATABASE_URL: postgresql://rtilens:rtilens_test@localhost:5432/rtilens_test
      run: |
        python3 test_orm_integrity.py

    - name: Start API
      env:
        DATABASE_URL: postgresql://rtilens:rtilens_test@localhost:5432/rtilens_test
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        PYTHONPATH=$(pwd) python3 backend/main.py &
        sleep 5

    - name: Run API tests
      run: |
        ./test_all_endpoints.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: |
        pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: |
        black --check backend/

    - name: Check import sorting
      run: |
        isort --check-only backend/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: rtilens-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy notification
      run: |
        echo "Deployment step - configure based on your hosting platform"
        echo "Options: AWS ECS, Google Cloud Run, Azure Container Apps, etc."
