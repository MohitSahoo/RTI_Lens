<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTI-Lens Test Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #333; margin-bottom: 30px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab { padding: 12px 24px; cursor: pointer; background: none; border: none; font-size: 16px; color: #666; transition: all 0.3s; }
        .tab.active { color: #007bff; border-bottom: 2px solid #007bff; margin-bottom: -2px; }
        .tab:hover { color: #007bff; }
        .tab-content { display: none; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        textarea { min-height: 120px; font-family: inherit; }
        button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 4px; border-left: 4px solid #007bff; }
        .error { border-left-color: #dc3545; background: #fff5f5; color: #dc3545; }
        .success { border-left-color: #28a745; background: #f0fff4; }
        .loading { text-align: center; padding: 20px; color: #666; }
        .source { background: white; padding: 15px; margin: 10px 0; border-radius: 4px; border: 1px solid #ddd; }
        .health { position: fixed; top: 20px; right: 20px; padding: 10px 20px; background: white; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .health.healthy { border-left: 4px solid #28a745; }
        .health.unhealthy { border-left: 4px solid #dc3545; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="health" id="health">
        <button onclick="checkHealth()">Check API Health</button>
    </div>

    <div class="container">
        <h1>🔍 RTI-Lens API Test Interface</h1>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('qa')">💬 Q&A</button>
            <button class="tab" onclick="switchTab('draft')">📝 Draft Appeal</button>
            <button class="tab" onclick="switchTab('predict')">🎯 Predict</button>
            <button class="tab" onclick="switchTab('analytics')">📊 Analytics</button>
            <button class="tab" onclick="switchTab('graph')">🕸️ Knowledge Graph</button>
        </div>

        <!-- Q&A Tab -->
        <div id="qa" class="tab-content active">
            <h2>Ask Questions About RTI Rulings</h2>
            <div class="form-group">
                <label>Question</label>
                <textarea id="qa-question" placeholder="e.g., What are common reasons for RTI denial under Section 8(1)(a)?"></textarea>
            </div>
            <div class="form-group">
                <label>Number of sources (1-20)</label>
                <input type="number" id="qa-topk" value="5" min="1" max="20">
            </div>
            <button onclick="askQuestion()">Ask Question</button>
            <div id="qa-result"></div>
        </div>

        <!-- Draft Tab -->
        <div id="draft" class="tab-content">
            <h2>Improve Appeal Draft</h2>
            <div class="form-group">
                <label>Ministry</label>
                <input type="text" id="draft-ministry" placeholder="e.g., Ministry of Home Affairs">
            </div>
            <div class="form-group">
                <label>Section Cited</label>
                <input type="text" id="draft-section" placeholder="e.g., 8(1)(a)">
            </div>
            <div class="form-group">
                <label>Appeal Context (min 50 chars)</label>
                <textarea id="draft-context" placeholder="Describe your RTI request and why it was denied..."></textarea>
            </div>
            <button onclick="generateDraft()">Generate Improvements</button>
            <div id="draft-result"></div>
        </div>

        <!-- Predict Tab -->
        <div id="predict" class="tab-content">
            <h2>Predict Appeal Outcome</h2>
            <div class="form-group">
                <label>Ministry</label>
                <input type="text" id="predict-ministry">
            </div>
            <div class="form-group">
                <label>Section Cited</label>
                <input type="text" id="predict-section">
            </div>
            <div class="form-group">
                <label>Appeal Level</label>
                <select id="predict-level">
                    <option value="first_appeal">First Appeal</option>
                    <option value="second_appeal">Second Appeal</option>
                </select>
            </div>
            <div class="form-group">
                <label>Order Text (min 100 chars)</label>
                <textarea id="predict-text" placeholder="Paste the full order text here..."></textarea>
            </div>
            <button onclick="predictOutcome()">Predict Outcome</button>
            <div id="predict-result"></div>
        </div>

        <!-- Analytics Tab -->
        <div id="analytics" class="tab-content">
            <h2>Analytics Dashboard</h2>
            <div class="form-group">
                <label>Select Analytics Type</label>
                <select id="analytics-type">
                    <option value="denial-rates">Denial Rates by Ministry</option>
                    <option value="section-heatmap">Section Misuse Heatmap</option>
                    <option value="override-trends">Override Trends</option>
                </select>
            </div>
            <button onclick="loadAnalytics()">Load Data</button>
            <div id="analytics-result"></div>
        </div>

        <!-- Graph Tab -->
        <div id="graph" class="tab-content">
            <h2>Knowledge Graph Visualization</h2>
            <button onclick="loadGraph()">Load Knowledge Graph</button>
            <div id="graph-summary"></div>
            <div id="graph-result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001';

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            if (event) event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        async function checkHealth() {
            const healthDiv = document.getElementById('health');
            try {
                const res = await fetch(`${API_BASE}/health`);
                const data = await res.json();
                healthDiv.className = 'health healthy';
                healthDiv.innerHTML = `<strong>✅ API Healthy</strong><br><small>${data.database}</small>`;
            } catch (e) {
                healthDiv.className = 'health unhealthy';
                healthDiv.innerHTML = `<strong>❌ API Offline</strong><br><small>${e.message}</small>`;
            }
        }

        async function askQuestion() {
            const question = document.getElementById('qa-question').value;
            const topK = document.getElementById('qa-topk').value;
            const resultDiv = document.getElementById('qa-result');

            if (question.length < 10) {
                resultDiv.innerHTML = '<div class="result error">Question must be at least 10 characters</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="loading">Searching rulings...</div>';

            try {
                const res = await fetch(`${API_BASE}/api/qa`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, top_k: parseInt(topK) })
                });

                const data = await res.json();

                if (res.ok) {
                    let html = '<div class="result success"><h3>Answer</h3><p>' + data.answer + '</p>';
                    if (data.confidence) html += '<p><strong>Confidence:</strong> ' + data.confidence + '</p>';
                    html += '<h3>Sources</h3>';
                    data.sources.forEach((s, i) => {
                        html += `<div class="source"><strong>Source ${i+1}:</strong> ${s.order_number || 'N/A'}<br><pre>${JSON.stringify(s, null, 2)}</pre></div>`;
                    });
                    html += '</div>';
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div class="result error">Error: ${data.detail || res.statusText}</div>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="result error">Request failed: ${e.message}</div>`;
            }
        }

        async function generateDraft() {
            const ministry = document.getElementById('draft-ministry').value;
            const section = document.getElementById('draft-section').value;
            const context = document.getElementById('draft-context').value;
            const resultDiv = document.getElementById('draft-result');

            if (context.length < 50) {
                resultDiv.innerHTML = '<div class="result error">Context must be at least 50 characters</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="loading">Analyzing appeal...</div>';

            try {
                const res = await fetch(`${API_BASE}/api/draft`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ministry, section_cited: section, context })
                });

                const data = await res.json();

                if (res.ok) {
                    let html = '<div class="result success">';
                    html += '<h3>Improved Query</h3><p>' + data.improved_query + '</p>';
                    html += '<h3>Change Notes</h3>';
                    data.change_notes.forEach(note => {
                        html += `<p><strong>${note.original}</strong> → <strong>${note.revised}</strong><br><em>Reason: ${note.reason}</em></p>`;
                    });
                    html += '<h3>Phrases to Avoid</h3><ul>';
                    data.avoid_phrases.forEach(phrase => {
                        html += `<li>❌ ${phrase}</li>`;
                    });
                    html += '</ul></div>';
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div class="result error">Error: ${data.detail || res.statusText}</div>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="result error">Request failed: ${e.message}</div>`;
            }
        }

        async function predictOutcome() {
            const ministry = document.getElementById('predict-ministry').value;
            const section = document.getElementById('predict-section').value;
            const level = document.getElementById('predict-level').value;
            const text = document.getElementById('predict-text').value;
            const resultDiv = document.getElementById('predict-result');

            if (text.length < 100) {
                resultDiv.innerHTML = '<div class="result error">Order text must be at least 100 characters</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="loading">Running prediction model...</div>';

            try {
                const res = await fetch(`${API_BASE}/api/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ministry, section_cited: section, appeal_level: level, raw_text: text })
                });

                const data = await res.json();

                if (res.ok) {
                    const color = data.prediction === 'allowed' ? 'success' : 'error';
                    let html = `<div class="result ${color}">`;
                    html += `<h3>Prediction: ${data.prediction.toUpperCase()}</h3>`;
                    html += `<p><strong>Probability:</strong> ${(data.probability * 100).toFixed(2)}%</p>`;
                    html += `<p><strong>Confidence:</strong> ${data.confidence}</p>`;
                    html += `<p><em>${data.disclaimer}</em></p>`;
                    if (data.low_data_warning) html += '<p>⚠️ Low data warning</p>';
                    html += '</div>';
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div class="result error">Error: ${data.detail || res.statusText}</div>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="result error">Request failed: ${e.message}</div>`;
            }
        }

        async function loadAnalytics() {
            const type = document.getElementById('analytics-type').value;
            const resultDiv = document.getElementById('analytics-result');

            resultDiv.innerHTML = '<div class="loading">Loading data...</div>';

            try {
                const res = await fetch(`${API_BASE}/api/analytics/${type}`);
                const data = await res.json();

                if (res.ok) {
                    let html = '<div class="result success">';
                    html += `<h3>Loaded ${data.length} records</h3>`;
                    html += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    html += '</div>';
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `<div class="result error">Error: ${data.detail || res.statusText}</div>`;
                }
            } catch (e) {
                resultDiv.innerHTML = `<div class="result error">Request failed: ${e.message}</div>`;
            }
        }

        async function loadGraph() {
            const summaryDiv = document.getElementById('graph-summary');
            const resultDiv = document.getElementById('graph-result');

            summaryDiv.innerHTML = '<div class="loading">Building graph...</div>';
            resultDiv.innerHTML = '';

            try {
                const res = await fetch(`${API_BASE}/api/graph`);
                const data = await res.json();

                if (res.ok) {
                    summaryDiv.innerHTML = `<div class="result success"><strong>✅ Graph loaded:</strong> ${data.metadata.node_count} nodes, ${data.metadata.edge_count} edges</div>`;
                    
                    let html = '<div class="result">';
                    html += '<h3>Nodes</h3><pre>' + JSON.stringify(data.nodes.slice(0, 10), null, 2) + '\nShowing 10 of ' + data.nodes.length + ' nodes</pre>';
                    html += '<h3>Edges</h3><pre>' + JSON.stringify(data.edges.slice(0, 10), null, 2) + '\nShowing 10 of ' + data.edges.length + ' edges</pre>';
                    html += '<h3>Full Graph Data</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    html += '</div>';
                    resultDiv.innerHTML = html;
                } else {
                    summaryDiv.innerHTML = `<div class="result error">Error: ${data.detail || res.statusText}</div>`;
                }
            } catch (e) {
                summaryDiv.innerHTML = `<div class="result error">Request failed: ${e.message}</div>`;
            }
        }

        // Check health on load
        checkHealth();
    </script>
</body>
</html>
